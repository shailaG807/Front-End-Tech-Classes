<!-- Goal: Fetch user details from an online server and display them on 
 our webpage without refreshing the entire page. -->


<!DOCTYPE html>
<html>
<head>
    <title>AJAX Example</title>
</head>
<body>

    <h2>AJAX - Load User Details</h2>

    <button onclick="loadUser()">Load User</button>

    <div id="result"></div>

    <script>

        function loadUser() {

            let xhr = new XMLHttpRequest();

            xhr.open("GET", "https://jsonplaceholder.typicode.com/users/5");

            xhr.onload = function() {

                let data = JSON.parse(xhr.responseText);

                document.getElementById("result").innerHTML =
                    "Name: " + data.name + "<br>" +
                    "Email: " + data.email + "<br>" +
                    "City: " + data.address.city;

            };

            xhr.send();

        }

    </script>

</body>
</html>
